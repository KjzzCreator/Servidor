<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Battle Royale Mobile - Free Fire Style</title>
    <style>
        body {
            margin: 0; padding: 0; background: #0b0f19; color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden; touch-action: none;
        }
        .container {
            width: 100%; max-width: 420px; height: 100vh; max-height: 750px;
            background: #111827; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            display: flex; flex-direction: column; position: relative; overflow: hidden;
            border: 2px solid #1f2937;
        }
        .screen { display: none; flex: 1; flex-direction: column; padding: 20px; box-sizing: border-box; justify-content: center; align-items: center; }
        .screen.active { display: flex; }
        
        h1 { color: #f59e0b; font-size: 26px; text-transform: uppercase; margin-bottom: 5px; text-shadow: 0 2px 10px rgba(245,158,11,0.4); }
        .subtitle { color: #9ca3af; font-size: 13px; margin-bottom: 20px; }
        
        .lobby-box { background: #1f2937; padding: 15px; border-radius: 10px; width: 100%; box-sizing: border-box; margin-bottom: 15px; border: 1px solid #374151; }
        .lobby-box label { font-size: 12px; color: #d1d5db; display: block; text-align: left; margin-bottom: 5px; font-weight: bold; }
        
        input, select {
            width: 100%; padding: 10px; background: #111827; border: 1px solid #4b5563;
            color: #fff; border-radius: 6px; font-size: 15px; box-sizing: border-box; margin-bottom: 10px; text-align: center;
        }
        
        .char-preview {
            width: 70px; height: 70px; border-radius: 50%; background: #3b82f6; margin: 10px auto;
            display: flex; justify-content: center; align-items: center; position: relative;
            box-shadow: 0 0 15px rgba(59,130,246,0.6); border: 3px solid #60a5fa;
        }
        .char-gun { position: absolute; right: -5px; width: 25px; height: 8px; background: #9ca3af; border-radius: 2px; }

        .btn-play {
            background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; border: none;
            padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; width: 100%;
            cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 15px rgba(245,158,11,0.4);
        }
        .btn-play:active { transform: scale(0.98); }

        #game-screen { padding: 0; position: relative; }
        canvas { display: block; background: #166534; width: 100%; height: 100%; }

        .hud-top {
            position: absolute; top: 10px; left: 10px; right: 10px;
            display: flex; justify-content: space-between; align-items: center; pointer-events: none;
            z-index: 10;
        }
        .stat-badge { background: rgba(0,0,0,0.7); padding: 6px 12px; border-radius: 6px; font-size: 13px; border: 1px solid rgba(255,255,255,0.1); }
        .hp-bar-container { width: 100px; height: 10px; background: #374151; border-radius: 5px; overflow: hidden; margin-top: 3px; }
        .hp-bar-fill { width: 100%; height: 100%; background: #10b981; transition: width 0.2s; }

        .chat-container {
            position: absolute; bottom: 100px; left: 10px; width: 180px; height: 90px;
            background: rgba(0,0,0,0.6); border-radius: 8px; display: flex; flex-direction: column;
            padding: 5px; border: 1px solid rgba(255,255,255,0.1); font-size: 10px; z-index: 10;
        }
        .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; margin-bottom: 4px; }
        .chat-msg { word-break: break-word; line-height: 1.2; }
        .chat-input-row { display: flex; gap: 4px; }
        .chat-input-row input { margin: 0; padding: 3px; font-size: 10px; text-align: left; }
        .chat-input-row button { padding: 3px 6px; margin: 0; font-size: 10px; width: auto; background: #3b82f6; color: #fff; border-radius: 4px; border:none;}

        /* JOYSTICK VIRTUAL MOBILE */
        #joystick-base {
            position: absolute; bottom: 20px; left: 20px; width: 110px; height: 110px;
            background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%; pointer-events: auto; z-index: 10; display: none;
        }
        #joystick-stick {
            position: absolute; top: 30px; left: 30px; width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.5); border-radius: 50%; pointer-events: none;
        }

        .controls-hud {
            position: absolute; bottom: 20px; right: 20px; display: flex; gap: 12px; pointer-events: auto; z-index: 10;
        }
        .action-btn {
            width: 65px; height: 65px; border-radius: 50%; background: rgba(239, 68, 68, 0.85);
            border: 3px solid #f87171; color: #fff; font-weight: bold; font-size: 12px;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); user-select: none;
        }
        .action-btn:active { transform: scale(0.9); background: #dc2626; }
        .reload-btn { background: rgba(59, 130, 246, 0.85); border-color: #60a5fa; }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

<div class="container">
    <div id="lobby-screen" class="screen active">
        <h1>Free Fire 2D</h1>
        <div class="subtitle">Modo Mobile + Alta Velocidade</div>

        <div class="lobby-box">
            <label>NOME DO SOBREVIVENTE:</label>
            <input type="text" id="name-input" value="Player" maxlength="15">

            <label>ESCOLHA SUA SKIN:</label>
            <select id="skin-select" onchange="updatePreview()">
                <option value="player_blue">Elite Azul</option>
                <option value="player_red">Comando Vermelho</option>
                <option value="player_yellow">Mercenário Dourado</option>
            </select>

            <label>ARMA PRINCIPAL:</label>
            <select id="weapon-select">
                <option value="glock">Glock 17 (Leve e rápida)</option>
                <option value="mp5">MP5 (Submetralhadora ágil)</option>
                <option value="ak47">AK-47 (Alto Dano)</option>
                <option value="xm8">XM8 (Fuzil tático moderno)</option>
            </select>

            <div class="char-preview" id="preview-box">
                <div class="char-gun"></div>
            </div>
        </div>

        <button class="btn-play" onclick="joinGame()">ENTRAR NA BATALHA</button>
    </div>

    <div id="game-screen" class="screen">
        <canvas id="gameCanvas"></canvas>

        <div class="hud-top">
            <div class="stat-badge">
                Vida: <span id="hp-txt">100</span>
                <div class="hp-bar-container"><div id="hp-bar" class="hp-bar-fill"></div></div>
            </div>
            <div class="stat-badge">Munição: <strong id="ammo-txt">30</strong></div>
            <div class="stat-badge">Abates: <strong id="kills-txt">0</strong></div>
        </div>

        <div class="chat-container">
            <div class="chat-messages" id="chat-msgs"></div>
            <div class="chat-input-row">
                <input type="text" id="chat-txt" placeholder="Conversar..." maxlength="80">
                <button onclick="sendChat()">Enviar</button>
            </div>
        </div>

        <!-- Joystick Touch na tela -->
        <div id="joystick-base">
            <div id="joystick-stick"></div>
        </div>

        <div class="controls-hud">
            <div class="action-btn reload-btn" onclick="socket.emit('reload')">REC</div>
            <div class="action-btn" id="shoot-btn">ATIRAR</div>
        </div>
    </div>
</div>

<script>
    const socket = io();
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let inGame = false;
    let myData = { name: '', skin: 'player_blue', weapon: 'glock' };
    let gameState = { players: {}, bullets: [] };
    let floatingTexts = [];
    
    let moveAngle = 0;
    let isMoving = false;
    let aimAngle = 0;

    function updatePreview() {
        const skin = document.getElementById("skin-select").value;
        const box = document.getElementById("preview-box");
        if(skin === 'player_blue') box.style.background = '#3b82f6';
        if(skin === 'player_red') box.style.background = '#ef4444';
        if(skin === 'player_yellow') box.style.background = '#eab308';
    }

    function joinGame() {
        myData.name = document.getElementById("name-input").value.trim() || "Sobrevivente";
        myData.skin = document.getElementById("skin-select").value;
        myData.weapon = document.getElementById("weapon-select").value;

        document.getElementById("lobby-screen").classList.remove("active");
        document.getElementById("game-screen").classList.add("active");
        document.getElementById("joystick-base").style.display = "block";

        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;

        socket.emit('joinGame', myData);
        inGame = true;
        requestAnimationFrame(gameLoop);
    }

    // Configuração do Joystick Virtual para Toque em Celular
    const joystickBase = document.getElementById("joystick-base");
    const joystickStick = document.getElementById("joystick-stick");
    let joystickTouchId = null;
    let baseCoords = {};

    joystickBase.addEventListener("touchstart", (e) => {
        e.preventDefault();
        let touch = e.changedTouches[0];
        joystickTouchId = touch.identifier;
        let rect = joystickBase.getBoundingClientRect();
        baseCoords = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
    });

    window.addEventListener("touchmove", (e) => {
        if (joystickTouchId === null) return;
        for (let i = 0; i < e.changedTouches.length; i++) {
            let touch = e.changedTouches[i];
            if (touch.identifier === joystickTouchId) {
                let dx = touch.clientX - baseCoords.x;
                let dy = touch.clientY - baseCoords.y;
                let dist = Math.hypot(dx, dy);
                let maxDist = 40;

                if (dist > maxDist) {
                    dx = (dx / dist) * maxDist;
                    dy = (dy / dist) * maxDist;
                }

                joystickStick.style.transform = `translate(${dx}px, ${dy}px)`;
                moveAngle = Math.atan2(dy, dx);
                aimAngle = moveAngle; // A arma aponta para onde corre
                isMoving = true;
            }
        }
    });

    window.addEventListener("touchend", (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
            if (e.changedTouches[i].identifier === joystickTouchId) {
                joystickTouchId = null;
                joystickStick.style.transform = `translate(0px, 0px)`;
                isMoving = false;
            }
        }
    });

    // Suporte também para Mouse no PC
    canvas.addEventListener("mousemove", (e) => {
        const rect = canvas.getBoundingClientRect();
        let mouseX = e.clientX - rect.left;
        let mouseY = e.clientY - rect.top;
        
        let me = gameState.players[socket.id];
        if (me) {
            let cameraX = me.x - canvas.width / 2;
            let cameraY = me.y - canvas.height / 2;
            aimAngle = Math.atan2((mouseY + cameraY) - me.y, (mouseX + cameraX) - me.x);
        }
    });

    document.getElementById("shoot-btn").addEventListener("touchstart", (e) => { e.preventDefault(); socket.emit('shoot'); });
    document.getElementById("shoot-btn").addEventListener("mousedown", () => { socket.emit('shoot'); });
    canvas.addEventListener("click", () => { socket.emit('shoot'); });

    socket.on('gameState', (state) => {
        gameState = state;
        let me = gameState.players[socket.id];
        if (me) {
            document.getElementById("hp-txt").innerText = me.hp;
            document.getElementById("hp-bar").style.width = me.hp + "%";
            document.getElementById("ammo-txt").innerText = me.ammo;
            document.getElementById("kills-txt").innerText = me.kills;
        }
    });

    socket.on('spawnDamage', (data) => {
        floatingTexts.push({
            x: data.x + (Math.random() * 20 - 10),
            y: data.y - 15,
            damage: data.damage,
            alpha: 1.0,
            color: data.damage > 25 ? '#ef4444' : '#facc15'
        });
    });

    socket.on('chatMessage', (data) => {
        const chatBox = document.getElementById("chat-msgs");
        const div = document.createElement("div");
        div.className = "chat-msg";
        div.innerHTML = `<b>${data.sender}:</b> ${data.text}`;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    });

    function sendChat() {
        const input = document.getElementById("chat-txt");
        if (input.value.trim() !== "") {
            socket.emit('chatMessage', input.value);
            input.value = "";
        }
    }

    // Loop de movimento com alta velocidade aumentada (5.5 pixels por frame)
    setInterval(() => {
        if (!inGame) return;
        let me = gameState.players[socket.id];
        if (me && me.alive && isMoving) {
            let speed = 5.5; 
            let newX = me.x + Math.cos(moveAngle) * speed;
            let newY = me.y + Math.sin(moveAngle) * speed;
            socket.emit('playerMove', { x: newX, y: newY, angle: aimAngle });
        }
    }, 1000 / 60);

    function gameLoop() {
        if (!inGame) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let me = gameState.players[socket.id];
        let cameraX = me ? me.x - canvas.width / 2 : 0;
        let cameraY = me ? me.y - canvas.height / 2 : 0;

        ctx.fillStyle = "#166534";
        ctx.fillRect(-cameraX, -cameraY, 1600, 1600);

        ctx.strokeStyle = "#15803d";
        ctx.lineWidth = 2;
        for(let i=0; i<=1600; i+=200) {
            ctx.beginPath(); ctx.moveTo(i - cameraX, 0 - cameraY); ctx.lineTo(i - cameraX, 1600 - cameraY); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0 - cameraX, i - cameraY); ctx.lineTo(1600 - cameraX, i - cameraY); ctx.stroke();
        }

        ctx.fillStyle = "#facc15";
        gameState.bullets.forEach(b => {
            ctx.beginPath();
            ctx.arc(b.x - cameraX, b.y - cameraY, 4, 0, Math.PI * 2);
            ctx.fill();
        });

        for (let id in gameState.players) {
            let p = gameState.players[id];
            if (!p.alive) continue;

            ctx.save();
            ctx.translate(p.x - cameraX, p.y - cameraY);
            ctx.rotate(p.angle);

            ctx.fillStyle = p.skin === 'player_red' ? '#ef4444' : (p.skin === 'player_yellow' ? '#eab308' : '#3b82f6');
            ctx.beginPath();
            ctx.arc(0, 0, 16, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#111";
            ctx.stroke();

            ctx.fillStyle = "#9ca3af";
            ctx.fillRect(8, -4, 14, 8);

            ctx.restore();

            ctx.fillStyle = "#fff";
            ctx.font = "11px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(p.name, p.x - cameraX, p.y - cameraY - 24);
        }

        for (let i = floatingTexts.length - 1; i >= 0; i--) {
            let ft = floatingTexts[i];
            ft.y -= 0.8;
            ft.alpha -= 0.02;

            if (ft.alpha <= 0) {
                floatingTexts.splice(i, 1);
                continue;
            }

            ctx.save();
            ctx.globalAlpha = ft.alpha;
            ctx.fillStyle = ft.color;
            ctx.font = "bold 16px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("-" + ft.damage, ft.x - cameraX, ft.y - cameraY);
            ctx.restore();
        }

        requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
